# 地震波形原档接收台 — 单服务 + 双持久卷，一条命令启动：
#   docker compose up --build
# 打开 http://localhost:8080 ；样例分片位于镜像内 /app/samples（也可用仓库内 samples/）。
#
# 两个命名卷故意分开：archive-data 是快盘（采集盘），archive-cold 是独立冷存储卷。
# 迁移时先把已核验档案复制到冷卷、核对字节数与 SHA-256，成功后才切换存储位置并清理快盘副本。
services:
  intake:
    build:
      context: .
      dockerfile: Dockerfile
    image: seismic-archive-intake:1.0.0
    container_name: seismic-archive-intake
    ports:
      - "${INTAKE_PORT:-8080}:8080"
    environment:
      ARCHIVE_DATA_DIR: /data
      ARCHIVE_COLD_DIR: /cold
      TZ: Asia/Shanghai
    volumes:
      - archive-data:/data
      - archive-cold:/cold
      - ./samples:/app/samples:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  archive-data:
  archive-cold:
